# บรรทัดที่เพิ่มต้องไม่มีรหัสผ่าน · connection string · host / IP · ผลรันจริง
name: secret-scan
on:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _trusted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: secret scan
        run: python _trusted/.github/scripts/secret_scan.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
